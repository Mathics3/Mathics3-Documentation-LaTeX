[build-system]
requires = [
    # setuptools and wheel are needed for pip install --no-build-isolation
    # --no-build-isoolation is used when the API breaks and we need to
    # build from a GitHub repository
    "Mathics3>=10.1",
]
build-backend = "setuptools.build_meta"

[project]
description = "Mathics3 LaTeX document generation."
dependencies = [
    "Mathics3>=10.1",
]
license = "GPL-3.0-or-later"
name = "Mathics3-LaTeX-Documentation"
requires-python = ">=3.11"
readme = "README.rst"
keywords = ["Mathematica", "Wolfram", "Interpreter", "Shell", "Math", "CAS"]
maintainers = [
    {name = "Mathics3 Group", email = "mathics-devel@googlegroups.com"},
]
classifiers = [
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Software Development :: Interpreters",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://mathics.org/"
Downloads = "https://github.com/Mathics3/Mathics3-Documentation-LateX/releases"

[project.scripts]
mathics = "mathics.__main__:main"
mathics3 = "mathics.__main__:main"
mathics3-codeparser-parse = "mathics.mathics3_code_parse:main"

[tool.codespell]
# Point to your custom ignore file
ignore-words = "codespell-ignore.txt"

# Exclude directories or files that often trigger false positives
skip = "*.pyd,*.pyc,./.git,./.venv,./build"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["mathics*"]

[tool.setuptools.package-data]
"mathics" = [
    "Autoload/*.m",
    "Packages/*/*.m",
    "Packages/*/Kernel/init.m",
    "SystemFiles/CharacterEncodings/*",
    "SystemFiles/Dictionaries/*/*.txt",
    "SystemFiles/Formats/*/*.wl",
    "Data/*.csv",
    "Data/*.json",
    "Data/*.pcl",
    "Data/*.yaml",
    "Data/*.yml",
    "Data/ExampleData/*",
    "autoload-cli/*.m",
    "autoload/*/*.m",
    # YAML files in test/format
    "test/format/*.yaml",
    # Documentation stuff that will be removed in 9.0.0 or before
    "doc/latex/mathics.pdf",
    # End doc stuff
    "test/data/*",
]
"mathics.doc" = [
    "documentation/*.mdoc",
    "xml/data",
]
"mathics.builtin.pymimesniffer" = [
    "mimetypes.xml",
]

[project.optional-dependencies]
full = [
    "Mathics3-Module-PyICU",
    "Mathics3-Module-networkx",
    "Mathics3-Module-nltk",
]

[tool.setuptools.dynamic]
version = {attr = "mathics.version.__version__"}

ignore_errors = true
